<!doctype html>
<html lang="fr" data-theme="auto">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" type="image/webp" href="/img/logo/logo-32.webp" />
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/fonts/Gotham-Regular.woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/fonts/Gotham-Medium.woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/fonts/LibreBaskerville-Regular.woff2"
			crossorigin="anonymous"
		/>
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('lecatechisme.theme');
					var allowed = ['auto', 'light', 'sepia', 'dark', 'oled'];
					var theme = stored && allowed.indexOf(stored) >= 0 ? stored : 'auto';
					document.documentElement.setAttribute('data-theme', theme);
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
